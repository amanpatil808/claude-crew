<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Crew Room</title>
<style>
/*ROOM_CSS*/
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="title-row">
      <h1>Crew Room</h1>
      <span class="status" id="status" role="status"><span class="dot" aria-hidden="true"></span><span id="status-t">Connecting…</span></span>
    </div>
    <nav aria-label="Projects"><ul class="picker" id="picker"></ul></nav>
  </div>
</header>
<main class="page">
  <div class="col">
    <section aria-labelledby="h-active"><h2 id="h-active">Active <span class="n" id="n-active"></span><span class="hint" id="hint-active" hidden>time working</span></h2><ul class="rows" id="active"></ul></section>
    <section aria-labelledby="h-queued"><h2 id="h-queued">Queued <span class="n" id="n-queued"></span><span class="hint" id="hint-queued" hidden>time waiting</span></h2><ol class="rows" id="queued"></ol></section>
  </div>
  <div class="col">
    <section aria-labelledby="h-crew"><h2 id="h-crew">Crew <span class="n" id="n-crew"></span></h2><ul class="crew" id="crew"></ul><p class="more" id="crew-more" hidden></p></section>
    <section aria-labelledby="h-recent"><h2 id="h-recent">Recent</h2><ul class="rows" id="recent" aria-live="polite" aria-relevant="additions"></ul></section>
    <section aria-labelledby="h-facts"><h2 id="h-facts">Facts <span class="hint" id="facts-hint"></span></h2><dl class="facts" id="facts"></dl></section>
  </div>
</main>
<script>
"use strict";
/*ROOM_JS*/
</script>
</body>
</html>
