<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Crew Room (board v2 mock-up)</title>
<!--
  Board v2 mock-up (Nobita). Static and self-contained: fake data for 2 projects, no server.
  Direction: docs/design/board-v2/direction.md. The data below has the /api/state shape from
  docs/planning/board-v2-contract.md, so the render code maps 1:1 onto the real page.
  Faces are the board's own rMini() avatars, captured as PNG for this file only; the page keeps drawing them in CSS.
  Try ?project=Notes%20Site, ?project=all, ?state=empty, ?state=offline.
-->
<style>
/* ---- Tokens: one set, light-dark() follows the device. Contrast checked in direction.md. ---- */
:root {
  color-scheme: light dark;
  --bg: light-dark(#f6efd9, #0d0b1f);
  --panel: light-dark(#fffaf0, #17143a);
  --ink: light-dark(#2b2340, #f2ecff);
  --muted: light-dark(#5b5170, #aaa3cc);
  --dim: light-dark(#6b6282, #948dbb);          /* greyed project chips: still AA on --bg */
  --line: light-dark(#e6dcc3, #2c2860);         /* row dividers (decorative) */
  --edge: light-dark(#2b2340, #4b4592);         /* panel border */
  --sel: light-dark(#2b2340, #f2ecff);          /* picked chip border: 3:1+ in both themes */
  --shade: light-dark(#2b2340, #05040f);        /* hard 3 px shadow, the Crew Room look */
  --accent: light-dark(#0e7490, #22d3ee);
  --ok: light-dark(#166534, #4ade80);
  --warn: light-dark(#92400e, #fbbf24);
  --bad: light-dark(#be123c, #fb7185);
  --on-bad: light-dark(#ffffff, #2a0610);
  --tint-ok: color-mix(in srgb, var(--ok) 14%, var(--panel));
  --tint-warn: color-mix(in srgb, var(--warn) 16%, var(--panel));
  --tint-bad: color-mix(in srgb, var(--bad) 14%, var(--panel));
  --tint-fresh: color-mix(in srgb, var(--accent) 16%, var(--panel));
  --font: ui-rounded, "SF Pro Rounded", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-panel: 12px; --r-chip: 8px; --r-pill: 999px;
  --gap: 16px;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
body { padding: 0 0 calc(32px + env(safe-area-inset-bottom, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Top bar: title + live status, then the project picker (not sticky: on a phone it would cover a third of the screen) ---- */
.top { background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 12px 16px 12px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font: 700 20px/1.2 var(--mono); letter-spacing: .02em; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
.status[data-s="stale"] { color: var(--warn); }
.status[data-s="stale"] .dot { background: var(--warn); }
.picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; padding: 0; list-style: none; }
.pchip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; font: inherit; font-size: 15px; line-height: 1.2;
  color: var(--dim); background: transparent; border: 1.5px dashed var(--dim); border-radius: var(--r-chip); cursor: pointer; }
.pchip .pn { font-weight: 600; }
.pchip .pc { font-size: 14px; font-variant-numeric: tabular-nums; }
.pchip:hover { color: var(--ink); border-style: solid; }
.pchip[aria-pressed="true"] { color: var(--ink); background: var(--panel); border: 2px solid var(--sel); box-shadow: 3px 3px 0 var(--shade); cursor: default; }
.pchip[aria-pressed="true"] .pc { color: var(--accent); font-weight: 600; }
.pchip:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- Layout: one column on phone; main + side from 900 px. DOM order = Active, Queued, Crew, Recent, Facts. ---- */
.page { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: var(--gap); grid-template-columns: minmax(0, 1fr); }
.col { display: grid; gap: var(--gap); align-content: start; min-width: 0; }
@media (min-width: 900px) {
  .top-in, .page { padding-left: 24px; padding-right: 24px; }
  .page { grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: 20px; padding-top: 20px; }
}
section { background: var(--panel); border: 2px solid var(--edge); border-radius: var(--r-panel); box-shadow: 3px 3px 0 var(--shade); padding: 14px 16px 6px; min-width: 0; }
h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; font: 700 15px/1.3 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
h2 .n { font: 600 15px var(--font); color: var(--accent); text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
h2 .hint { margin-left: auto; font: 400 13px var(--font); color: var(--muted); text-transform: none; letter-spacing: 0; }
.empty { margin: 6px 0 12px; color: var(--muted); font-size: 15px; }

/* ---- Row: [face] [who + chips | time] / [text] / [ref or project] ---- */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.face { width: 40px; height: 44px; display: block; grid-row: 1 / span 3; align-self: start; margin-top: -4px; }
.glyph { width: 40px; height: 36px; grid-row: 1 / span 3; display: grid; place-items: center; border-radius: var(--r-chip); background: transparent; border: 1.5px solid currentColor; color: var(--accent); font: 700 15px var(--mono); letter-spacing: .02em; }
.glyph[data-t="bad"] { background: var(--tint-bad); color: var(--bad); border-color: transparent; }
.glyph[data-t="ok"] { background: var(--tint-ok); color: var(--ok); border-color: transparent; }
.l1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.verb { font-size: 14px; color: var(--muted); white-space: nowrap; }
.l1 time { margin-left: auto; flex: none; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.txt { margin: 2px 0 0; font-size: 16px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.meta { margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.meta .ref { font-family: var(--mono); overflow-wrap: anywhere; }
.meta a, .txt a { color: var(--accent); text-underline-offset: 2px; }
.proj { font-weight: 600; }
.row.fresh { animation: fresh 2.4s ease-out; }
@keyframes fresh { from { background: var(--tint-fresh); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .row.fresh { animation: none; } }

/* Chips: the word carries the meaning, colour only helps. */
.chip { flex: none; display: inline-block; font: 700 13px/1 var(--mono); letter-spacing: .03em; padding: 4px 7px; border-radius: 6px; border: 1.5px solid transparent; }
.chip[data-p="P0"] { background: var(--bad); color: var(--on-bad); }
.chip[data-p="P1"] { background: var(--tint-warn); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.chip[data-p="P2"] { background: transparent; color: var(--muted); border-color: var(--muted); }
.chip.fail { background: var(--tint-bad); color: var(--bad); }
.chip.live { background: var(--tint-ok); color: var(--ok); }

/* ---- Crew: a compact grid of people for the picked project ---- */
.crew { list-style: none; margin: 0 0 4px; padding: 0; }
.person { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 0; border-top: 1px solid var(--line); }
.person:first-child { border-top: 0; }
.person .face { flex: none; }
.person b { flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person > span { flex: none; font-size: 14px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.person[data-s="working"] > span { color: var(--accent); font-weight: 600; }
.person .pj { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.more { margin: 0 0 12px; font-size: 14px; color: var(--muted); }

/* ---- Facts ---- */
.facts { margin: 0 0 10px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 14px; align-items: baseline; }
.facts dt { font: 700 13px var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.facts dd { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
.facts .v { font-family: var(--mono); font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.facts .when { font-size: 14px; color: var(--muted); }
.facts .pdt { font: 650 15px var(--font); text-transform: none; letter-spacing: 0; color: var(--ink); }
.facts .ref-b { flex-basis: 100%; font-family: var(--mono); font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="title-row">
      <h1>Crew Room</h1>
      <span class="status" id="status" role="status"><span class="dot" aria-hidden="true"></span><span id="status-t">Connecting…</span></span>
    </div>
    <nav aria-label="Projects"><ul class="picker" id="picker"></ul></nav>
  </div>
</header>
<main class="page">
  <div class="col">
    <section aria-labelledby="h-active"><h2 id="h-active">Active <span class="n" id="n-active"></span><span class="hint">time working</span></h2><ul class="rows" id="active"></ul></section>
    <section aria-labelledby="h-queued"><h2 id="h-queued">Queued <span class="n" id="n-queued"></span><span class="hint">time waiting</span></h2><ol class="rows" id="queued"></ol></section>
  </div>
  <div class="col">
    <section aria-labelledby="h-crew"><h2 id="h-crew">Crew <span class="n" id="n-crew"></span></h2><ul class="crew" id="crew"></ul><p class="more" id="crew-more" hidden></p></section>
    <section aria-labelledby="h-recent"><h2 id="h-recent">Recent</h2><ul class="rows" id="recent" aria-live="polite" aria-relevant="additions"></ul></section>
    <section aria-labelledby="h-facts"><h2 id="h-facts">Facts <span class="hint" id="facts-hint"></span></h2><dl class="facts" id="facts"></dl></section>
  </div>
</main>

const ALL = "all";
const q = new URLSearchParams(location.search);
const STATE = q.get("state");
const S = STATE === "empty" ? { ...FULL, projects: FULL.projects.map((p) => ({ ...p, working: 0 })), tasks: { active: [], queued: [] }, recent: [], doneAt: {} } : FULL;
const names = S.projects.map((p) => p.name);
const remembered = (() => { try { return localStorage.getItem("crewProject"); } catch { return null; } })();
// Default: ?project=, then the last pick, then focus. "all" is a real choice.
let pick = [q.get("project"), remembered, S.focus].find((p) => p === ALL || names.includes(p)) || ALL;
const inView = (x) => pick === ALL || x.project === pick;

function face(role, label) {
  const img = el("img", "face"); img.src = FACES[role] || ""; img.alt = ""; img.width = 40; img.height = 44;
  img.setAttribute("aria-hidden", "true"); if (label) img.title = label; return img;
}
function time(iso, text, label) { const t = el("time", null, text); t.dateTime = iso; t.title = label; return t; }

// One task row. kind: "active" (elapsed working) or "queued" (elapsed waiting).
function taskRow(t, kind) {
  const li = el("li", "row"), who = ROLES[t.role] || t.role;
  const l1 = el("div", "l1"); l1.append(el("span", "who", who));
  if (t.priority) { const c = el("span", "chip", t.priority); c.dataset.p = t.priority; c.title = { P0: "P0: do first", P1: "P1: next", P2: "P2: when free" }[t.priority]; l1.append(c); }
  const iso = kind === "active" ? t.startedAt : t.queuedAt, m = mins(iso);
  l1.append(time(iso, span(m), `${kind === "active" ? "Started" : "Queued"} ${hm(iso)} IST`));
  li.append(face(t.role, who), l1, el("p", "txt", t.text));
  const meta = el("p", "meta");
  if (pick === ALL) meta.append(el("span", "proj", t.project));
  if (t.ref) meta.append(el("span", "ref", t.ref));
  if (t.override) meta.append(el("span", null, `model override: ${t.override}`));
  if (meta.childElementCount) li.append(meta);
  li.querySelector(".txt").title = t.text;
  li.setAttribute("aria-label", `${who}${t.priority ? ", " + t.priority : ""}: ${t.text}. ${kind === "active" ? "Working for" : "Waiting"} ${span(m)}${pick === ALL ? ". " + t.project : ""}`);
  return li;
}

function recentRow(f) {
  const li = el("li", "row"), l1 = el("div", "l1");
  let who, mark;
  // Roles show their face; PRs, CI and deploys show a short mark. Only a failure gets a chip: the text already says the outcome.
  if (f.role) { who = ROLES[f.role]; mark = face(f.role, who); }
  else {
    const ci = f.kind === "ci", [label, word, tone] = f.tone === "pr" ? ["PR", "Pull request", ""] : [ci ? "CI" : "\u25B2", ci ? "CI" : "Deploy", f.tone === "bad" ? "bad" : "ok"];
    who = word; mark = el("span", "glyph", label); mark.setAttribute("aria-hidden", "true"); if (tone) mark.dataset.t = tone;
  }
  l1.append(el("span", "who", who));
  if (f.tone === "done") l1.append(el("span", "verb", "handed back"));
  if (f.tone === "bad") l1.append(el("span", "chip fail", "failed"));
  l1.append(time(f.ts, hm(f.ts), `${hm(f.ts)} IST`));
  const txt = el("p", "txt");
  if (f.url) { const a = el("a", null, f.text); a.href = f.url; a.target = "_blank"; a.rel = "noopener noreferrer"; txt.append(a); } else txt.textContent = f.text;
  li.append(mark, l1, txt);
  if (pick === ALL) { const meta = el("p", "meta"); meta.append(el("span", "proj", f.project)); li.append(meta); }
  return li;
}

function renderPicker() {
  const active = (n) => n === ALL ? S.tasks.active.length : S.tasks.active.filter((t) => t.project === n).length;
  const chip = (n, label) => {
    const li = el("li"), b = el("button", "pchip"); b.type = "button"; b.setAttribute("aria-pressed", String(pick === n));
    const c = active(n); b.append(el("span", "pn", label), el("span", "pc", `${c} active`));
    b.onclick = () => { if (pick === n) return; pick = n; try { localStorage.setItem("crewProject", n); } catch {} const u = new URL(location.href); u.searchParams.set("project", n); history.replaceState(null, "", u); render(); };
    li.append(b); return li;
  };
  $("picker").replaceChildren(...names.map((n) => chip(n, n)), chip(ALL, "All projects"));
}

function render() {
  renderPicker();
  const label = pick === ALL ? "all projects" : pick;
  const act = S.tasks.active.filter(inView), que = S.tasks.queued.filter(inView);
  $("n-active").textContent = act.length; $("n-queued").textContent = que.length;
  // The time hint only makes sense next to rows.
  document.querySelector("#h-active .hint").hidden = !act.length; document.querySelector("#h-queued .hint").hidden = !que.length;
  $("active").replaceChildren(...(act.length ? act.map((t) => taskRow(t, "active")) : [el("li", "empty", `Nobody is working on ${label} right now.`)]));
  $("queued").replaceChildren(...(que.length ? que.map((t) => taskRow(t, "queued")) : [el("li", "empty", "Nothing queued.")]));

  // Crew: roles with active or queued work in view (one entry per project + role on "All projects").
  const people = new Map();
  for (const t of [...act, ...que]) {
    const k = `${t.project}|${t.role}`, p = people.get(k) || { role: t.role, project: t.project, working: null, queued: 0 };
    if (t.state === "active") p.working = t; else p.queued++;
    people.set(k, p);
  }
  const list = [...people.values()].sort((a, b) => (b.working ? 1 : 0) - (a.working ? 1 : 0) || (ROLES[a.role] || "").localeCompare(ROLES[b.role] || ""));
  $("n-crew").textContent = list.length ? `${list.filter((p) => p.working).length} working` : "";
  $("crew").replaceChildren(...list.map((p) => {
    const li = el("li", "person"); li.dataset.s = p.working ? "working" : "free";
    const state = p.working ? `Working · ${span(mins(p.working.startedAt))}` : `Free · ${p.queued} queued`;
    const nm = el("b", null, ROLES[p.role]); if (pick === ALL) nm.append(el("span", "pj", p.project));
    li.append(face(p.role, ROLES[p.role]), nm, el("span", null, state));
    return li;
  }));
  const free = ROSTER_SIZE - list.length;
  $("crew-more").hidden = false;
  $("crew-more").textContent = list.length ? `${free} others free, nothing queued for them.` : `All ${ROSTER_SIZE} crew are free.`;

  const rec = S.recent.filter(inView).slice(0, 8);
  $("recent").replaceChildren(...(rec.length ? rec.map(recentRow) : [el("li", "empty", "No hand-backs, PRs or deploys yet.")]));

  const facts = [];
  const projs = pick === ALL ? names : [pick];
  // One project: two rows (Live, Branch). All projects: one row per project, live version then branch.
  const liveBits = (f) => f.live ? [el("span", "v", f.live.version), el("span", `chip ${f.live.status === "ok" ? "live" : "fail"}`, f.live.status === "ok" ? "ok" : "failed"), el("span", "when", `since ${hm(f.live.at)}`)] : [el("span", "when", "Not checked for this project")];
  for (const n of projs) {
    const f = S.facts[n] || {};
    if (pick === ALL) { const dd = el("dd"); dd.append(...liveBits(f), el("span", "ref-b", f.branch || "branch unknown")); facts.push([el("dt", "pdt", n), dd]); continue; }
    const live = el("dd"); live.append(...liveBits(f));
    const br = el("dd"); br.append(el("span", "v", f.branch || "unknown"));
    facts.push([el("dt", null, "Live"), live], [el("dt", null, "Branch"), br]);
  }
  $("facts").replaceChildren(...facts.flat());
  $("facts-hint").textContent = pick === ALL ? "live version · branch" : "";

  const stale = STATE === "offline";
  $("status").dataset.s = stale ? "stale" : "live";
  $("status-t").textContent = stale ? "Not answering · last 08:44" : `Live · ${hm(new Date(NOW).toISOString())} IST`;
  document.title = `Crew Room · ${pick === ALL ? "All projects" : pick} · ${act.length} active`;
}
render();
</script>
</body>
</html>
