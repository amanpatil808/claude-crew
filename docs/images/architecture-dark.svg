<svg xmlns="http://www.w3.org/2000/svg" width="820" height="770" viewBox="0 0 820 770" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">How toon-crew works: from your ask to a merged pull request</title>
<desc id="d">You ask. Doraemon, the manager agent, plans and briefs the crew; memory feeds every brief. The crew works inside the guard: Backend, Frontend and DevOps build in their own git worktrees, Docs writes, and Security, QA, Research and Helpers review and test read-only. Each writes a hand-back. Doraemon checks and commits, opens a pull request and CI runs. You approve, and DevOps merges. The Crew Room board is an optional add-on.</desc>
