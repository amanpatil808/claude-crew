name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums file
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  CLAUDE_CODE_VERSION: 2.1.308

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Structure check
        run: node scripts/check-structure.mjs

      - name: Validate plugin and marketplace (claude plugin validate --strict)
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude plugin validate . --strict          # marketplace
          claude plugin validate ./plugin --strict   # plugin

      # Skipped or todo tests count as failures to investigate.
      - name: Guard and registry tests
        run: |
          node --test --test-reporter=tap plugin/hooks/test/*.test.mjs | tee guard-tests.tap
          grep -qE '^# skipped 0$' guard-tests.tap
          grep -qE '^# todo 0$' guard-tests.tap
          grep -qE '^# fail 0$' guard-tests.tap

      - name: Board tests
        run: |
          if ls plugin/board/test/*.test.ts >/dev/null 2>&1; then
            node --no-warnings --test --test-reporter=tap plugin/board/test/*.test.ts | tee board-tests.tap
            grep -qE '^# skipped 0$' board-tests.tap
            grep -qE '^# todo 0$' board-tests.tap
            grep -qE '^# fail 0$' board-tests.tap
          else
            echo "No plugin/board/test/*.test.ts yet; skipping."
          fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (all commits)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
