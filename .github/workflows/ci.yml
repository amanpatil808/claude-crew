name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums file
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  CLAUDE_CODE_VERSION: 2.1.308
  # The stated minimum (README: "Needs Claude Code 2.1.295+"); onFailure: block needs it.
  CLAUDE_CODE_MIN_VERSION: 2.1.295

# pipefail, so `node --test ... | tee` fails when node fails.
defaults:
  run:
    shell: bash

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Structure check
        run: node scripts/check-structure.mjs

      - name: Validate plugin and marketplace (claude plugin validate --strict)
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version | grep -qxF "${CLAUDE_CODE_VERSION} (Claude Code)"
          claude plugin validate . --strict          # marketplace
          claude plugin validate ./plugin --strict   # plugin

      # Skipped or todo tests count as failures to investigate. An empty glob runs
      # zero tests and still prints "# fail 0", so each step also needs "# pass N", N >= 1.
      - name: Guard and registry tests
        run: |
          node --test --test-reporter=tap tests/hooks/*.test.mjs | tee guard-tests.tap
          grep -qE '^# pass [1-9][0-9]*$' guard-tests.tap
          grep -qE '^# skipped 0$' guard-tests.tap
          grep -qE '^# todo 0$' guard-tests.tap
          grep -qE '^# fail 0$' guard-tests.tap

      - name: Board tests
        run: |
          node --no-warnings --test --test-reporter=tap tests/board/*.test.ts | tee board-tests.tap
          grep -qE '^# pass [1-9][0-9]*$' board-tests.tap
          grep -qE '^# skipped 0$' board-tests.tap
          grep -qE '^# todo 0$' board-tests.tap
          grep -qE '^# fail 0$' board-tests.tap

      - name: Script tests
        run: |
          node --test --test-reporter=tap scripts/*.test.mjs | tee script-tests.tap
          grep -qE '^# pass [1-9][0-9]*$' script-tests.tap
          grep -qE '^# skipped 0$' script-tests.tap
          grep -qE '^# todo 0$' script-tests.tap
          grep -qE '^# fail 0$' script-tests.tap

  # The oldest Claude Code the README promises. Validation only: the tests above do not
  # depend on the CLI version, so this job stays small.
  min-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate plugin and marketplace at the minimum Claude Code version
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_MIN_VERSION}"
          claude --version | grep -qxF "${CLAUDE_CODE_MIN_VERSION} (Claude Code)"
          claude plugin validate . --strict          # marketplace
          claude plugin validate ./plugin --strict   # plugin

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (all commits)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
