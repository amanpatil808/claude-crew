name: Feature request
description: Suggest an idea or an improvement for toon-crew.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Small, specific requests are easiest to act on.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the missing piece, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Your idea in a few sentences. An example of how it would look or work helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Other ways you tried to solve it, if any.
  - type: dropdown
    id: area
    attributes:
      label: Which part is it about?
      options:
        - The guard
        - The board (Crew Room)
        - The hooks or the event log
        - Agents or skills
        - Docs
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: secrets
    attributes:
      label: Before you send
      options:
        - label: I removed secrets and personal paths from anything I pasted.
          required: true
